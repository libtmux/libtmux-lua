name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest released tmux, full runs the whole
          table with the refusal jobs and the development builds, custom runs
          the refs in tmux-ref. A release is bound to a full run.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6b,master.
        type: string
        default: ''
      lua:
        description: >-
          Comma-separated Lua runtimes for the tmux jobs, from
          data/ci-matrix.json, such as 5.1.5,luajit. Empty means the default
          stack.
        type: string
        default: ''
      nvim:
        description: >-
          Comma-separated Neovim versions for the tmux jobs, from
          data/ci-matrix.json, such as 0.10.0. Empty means the default stack.
        type: string
        default: ''
      os:
        description: Runner image for the test jobs
        type: choice
        options: [ubuntu-24.04, ubuntu-latest, ubuntu-22.04]
        default: ubuntu-24.04
      tmate:
        description: >-
          Open a tmate session on the one tmux job, before the tests or after a
          failure. It needs scope custom with a single tmux-ref, lua and nvim.
        type: choice
        options: ['off', before-tests, on-failure]
        default: 'off'
  workflow_call:
    inputs:
      scope:
        description: How much of the table to cover. Publish passes full.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What a run covers is decided here from the tmux catalog,
  # data/ci-matrix.json and the event, so no job below lists a version. A push
  # and a pull request test the oldest and newest released tmux; a release and
  # a dispatch with scope full test the whole table.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            data
            .tool-versions
      - uses: ./.github/actions/lua-tools
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          LUA: ${{ inputs.lua }}
          NVIM: ${{ inputs.nvim }}
          IMAGE: ${{ inputs.os }}
          TMATE: ${{ inputs.tmate }}
        run: |
          luajit scripts/ci_plan/ci_plan.lua plan \
            --event "$EVENT" \
            --scope "$SCOPE" \
            --tmux-ref "$TMUX_REF" \
            --lua "$LUA" \
            --nvim "$NVIM" \
            --os "$IMAGE" \
            --tmate "$TMATE" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  validate:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ needs.plan.outputs.os }}
    # A tmate session needs longer than a test run does.
    timeout-minutes: ${{ matrix.tmate == 'off' && 20 || 60 }}
    strategy:
      fail-fast: false
      # The plan chooses the jobs and never leaves this empty.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI_LUA: ${{ matrix.lua }}
      CI_TMUX: ${{ matrix.tmux }}
      CI_CLIENT: ${{ matrix.client }}
      CI_NVIM: ${{ matrix.nvim }}
      CI_GATE: ${{ matrix.gate }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: 'true'
          args: install --no-install-recommends --yes build-essential cmake libreadline-dev
      - uses: ./.github/actions/lua-tools
        with:
          groups: dev live lint
      # lua.org times out from runners now and then; the SHA256 pins in
      # runtimes.lua still verify a restored archive.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/source/lua-*.tar.gz
          key: lua-source-${{ hashFiles('scripts/bootstrap/runtimes.lua') }}-${{ matrix.lua }}
      # The outer gate also builds the pinned 5.4.9 lint interpreter, whatever
      # the matrix Lua is. The path matches the step above, so the 5.4.9 unit
      # job's entry restores here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.gate == 'outer'
        with:
          path: .cache/source/lua-*.tar.gz
          key: lua-source-${{ hashFiles('scripts/bootstrap/runtimes.lua') }}-5.4.9
      - name: Create the diagnostics directory
        run: mkdir -p .cache/ci
      - name: Select the test Lua and build it if mise does not provide it
        run: lua scripts/bootstrap/bootstrap.lua select-lua "$CI_LUA" --github-env="$GITHUB_ENV" 2>&1 | tee .cache/ci/runtime.log
      - name: Install the test dependencies
        run: lua scripts/bootstrap/bootstrap.lua rocks dev live --lua="$TEST_LUA" 2>&1 | tee .cache/ci/dependencies.log
      - name: Install the Neovim host
        if: matrix.gate != 'unit'
        run: luajit scripts/bootstrap/bootstrap.lua hosts "$CI_NVIM" 2>&1 | tee .cache/ci/neovim.log
      - name: Build tmux
        if: matrix.gate != 'unit'
        id: tmux
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.ref }}
      - name: Build the client tmux
        if: matrix.client
        id: client
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.client }}
      - name: Select the tmux build
        if: matrix.gate != 'unit'
        env:
          TMUX_BUILT: ${{ steps.tmux.outputs.binary }}
        run: echo "LIBTMUX_TEST_TMUX=$TMUX_BUILT" >> "$GITHUB_ENV"
      - name: Select the client tmux build
        if: matrix.client && matrix.gate != 'unit'
        env:
          CLIENT_BUILT: ${{ steps.client.outputs.binary }}
        run: echo "CI_CLIENT_BIN=$CLIENT_BUILT" >> "$GITHUB_ENV"
      - name: Install stylua for the outer gate
        if: matrix.gate == 'outer'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install stylua@2.4.0
      - name: Put stylua on the path
        if: matrix.gate == 'outer'
        run: mise where stylua@2.4.0 >> "$GITHUB_PATH"
      - name: Install actionlint for the outer gate
        if: matrix.gate == 'outer'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install actionlint@1.7.12
      - name: Put actionlint on the path
        if: matrix.gate == 'outer'
        run: mise where actionlint@1.7.12 >> "$GITHUB_PATH"
      - name: Build the pinned Lua 5.4.9 lint interpreter
        if: matrix.gate == 'outer'
        run: lua scripts/bootstrap/bootstrap.lua runtimes 5.4.9
      - name: Install the lint rocks
        if: matrix.gate == 'outer'
        run: lua scripts/bootstrap/bootstrap.lua rocks lint --lua=.cache/toolchains/lua-5.4.9/bin/lua
      - name: Install the pinned LuaLS
        if: matrix.gate == 'outer'
        run: lua scripts/bootstrap/bootstrap.lua luals
      - name: Record tool identities
        env:
          IDENTITY_NVIM: ${{ matrix.gate != 'unit' && format('.cache/toolchains/nvim-{0}/bin/nvim', matrix.nvim) || '' }}
          IDENTITY_TMUX: ${{ steps.tmux.outputs.binary }}
          IDENTITY_CLIENT: ${{ steps.client.outputs.binary }}
        run: luajit scripts/ci_plan/ci_plan.lua identity --lua "$TEST_LUA" --tmux "$IDENTITY_TMUX" --client "$IDENTITY_CLIENT" --nvim "$IDENTITY_NVIM" 2>&1 | tee .cache/ci/identity.log
      - name: Open a tmate session before the tests
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
      - name: Run the unit gate
        if: matrix.gate == 'unit'
        run: luajit scripts/check/check.lua unit --lua "$TEST_LUA" 2>&1 | tee .cache/ci/check.log
      - name: Run the ${{ matrix.gate }} gate
        if: matrix.gate != 'unit'
        run: luajit scripts/check/check.lua "$CI_GATE" --lua "$TEST_LUA" --nvim ".cache/toolchains/nvim-$CI_NVIM/bin/nvim" 2>&1 | tee .cache/ci/check.log
      - name: Run the refusal check with a newer client
        if: matrix.client
        env:
          TMUX_CLIENT_BIN: ${{ steps.client.outputs.binary }}
          LIBTMUX_REFUSAL_MAX_MS: '500'
        run: luajit scripts/check/check.lua refusal --lua "$TEST_LUA" --nvim ".cache/toolchains/nvim-$CI_NVIM/bin/nvim" 2>&1 | tee .cache/ci/mixed-client.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ strategy.job-index }}
          path: |
            .cache/ci/
            .cache/source/*-build.log
            .cache/luals/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the release event
        if: matrix.name == 'Outer current' && github.event_name == 'push' && github.ref_type == 'tag'
        run: luajit scripts/release/main.lua verify --event "$GITHUB_EVENT_PATH" --commit "$GITHUB_SHA"
      - name: Package the release candidate
        if: matrix.name == 'Outer current' && !(github.event_name == 'push' && github.ref_type == 'tag')
        run: luajit scripts/package/main.lua --release --lua "$TEST_LUA" --output dist
      - name: Package the release candidate for a public tag
        if: matrix.name == 'Outer current' && github.event_name == 'push' && github.ref_type == 'tag'
        run: luajit scripts/package/main.lua --release --lua "$TEST_LUA" --output dist --public-tag
      - name: Retain release candidate
        if: matrix.name == 'Outer current'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Open a tmate session after a failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  # One check to require. The plan and the matrix have to have succeeded; a
  # matrix that never ran because the plan failed must not read as a pass.
  required:
    name: required
    needs: [plan, validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
            .tool-versions
      - uses: ./.github/actions/lua-tools
      - name: Require every planned job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: luajit scripts/ci_plan/ci_plan.lua verify
