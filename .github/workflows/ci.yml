name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scope:
        description: >-
          edges runs the oldest and newest released tmux, full runs the whole
          table with the refusal jobs and the development builds, custom runs
          the refs in tmux-ref. A release is bound to a full run.
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: >-
          With scope custom, comma-separated tmux versions, tags, branches or
          40-hex commit SHAs from github.com/tmux/tmux, such as 3.6b,master.
        type: string
        default: ''
      lua:
        description: >-
          Comma-separated Lua runtimes for the tmux jobs, from
          data/ci-matrix.json, such as 5.1.5,luajit. Empty means the default
          stack.
        type: string
        default: ''
      nvim:
        description: >-
          Comma-separated Neovim versions for the tmux jobs, from
          data/ci-matrix.json, such as 0.10.0. Empty means the default stack.
        type: string
        default: ''
      os:
        description: Runner image for the test jobs
        type: choice
        options: [ubuntu-24.04, ubuntu-latest, ubuntu-22.04]
        default: ubuntu-24.04
      tmate:
        description: >-
          Open a tmate session on the one tmux job, before the tests or after a
          failure. It needs scope custom with a single tmux-ref, lua and nvim.
        type: choice
        options: [off, before-tests, on-failure]
        default: 'off'
  workflow_call:
    inputs:
      scope:
        description: How much of the table to cover. Publish passes full.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # What a run covers is decided here from the tmux catalog,
  # data/ci-matrix.json and the event, so no job below lists a version. A push
  # and a pull request test the oldest and newest released tmux; a release and
  # a dispatch with scope full test the whole table.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      os: ${{ steps.plan.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            data
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          LUA: ${{ inputs.lua }}
          NVIM: ${{ inputs.nvim }}
          IMAGE: ${{ inputs.os }}
          TMATE: ${{ inputs.tmate }}
        run: |
          python3 scripts/ci_plan.py plan \
            --event "$EVENT" \
            --scope "$SCOPE" \
            --tmux-ref "$TMUX_REF" \
            --lua "$LUA" \
            --nvim "$NVIM" \
            --os "$IMAGE" \
            --tmate "$TMATE" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  validate:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ needs.plan.outputs.os }}
    # A tmate session needs longer than a test run does.
    timeout-minutes: ${{ matrix.tmate == 'off' && 20 || 60 }}
    strategy:
      fail-fast: false
      # The plan chooses the jobs and never leaves this empty.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI_LUA: ${{ matrix.lua }}
      CI_TMUX: ${{ matrix.tmux }}
      CI_CLIENT: ${{ matrix.client }}
      CI_NVIM: ${{ matrix.nvim }}
      CI_GATE: ${{ matrix.gate }}
      CI_BUILD: ${{ matrix.build }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config autoconf automake libtool bison libevent-dev libncurses-dev libreadline-dev
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.9
      - name: Select Lua and install test dependencies
        run: |
          mkdir -p .cache/ci
          if [[ "$CI_LUA" == '5.5.1' ]]; then
            test_lua="$(mise which lua)"
          else
            python scripts/bootstrap_runtimes.py "$CI_LUA" 2>&1 | tee .cache/ci/runtime.log
            if [[ "$CI_LUA" == luajit ]]; then
              test_lua="$PWD/.cache/toolchains/luajit-2.1/bin/luajit"
            else
              test_lua="$PWD/.cache/toolchains/lua-$CI_LUA/bin/lua"
            fi
          fi
          echo "TEST_LUA=$test_lua" >> "$GITHUB_ENV"
          python scripts/bootstrap.py dev live --lua="$test_lua" 2>&1 | tee .cache/ci/dependencies.log
      - name: Build live-test prerequisites
        if: matrix.gate != 'unit'
        run: |
          python scripts/bootstrap_hosts.py "$CI_NVIM" 2>&1 | tee .cache/ci/neovim.log
          if [[ "$CI_BUILD" == ref ]]; then
            python scripts/bootstrap_native.py tmux --tmux-ref="$CI_TMUX" | tee .cache/ci/tmux.log
            echo "TMUX_BIN=$(jq -r 'select(.executable) | .executable' .cache/ci/tmux.log)" >> "$GITHUB_ENV"
          else
            python scripts/bootstrap_native.py tmux --tmux-version="$CI_TMUX" 2>&1 | tee .cache/ci/tmux.log
            echo "TMUX_BIN=$PWD/.cache/toolchains/tmux-$CI_TMUX/bin/tmux" >> "$GITHUB_ENV"
          fi
          if [[ -n "$CI_CLIENT" ]]; then
            python scripts/bootstrap_native.py tmux --tmux-version="$CI_CLIENT" 2>&1 | tee .cache/ci/client.log
            echo "CI_CLIENT_BIN=$PWD/.cache/toolchains/tmux-$CI_CLIENT/bin/tmux" >> "$GITHUB_ENV"
          fi
      - name: Install outer-gate prerequisites
        if: matrix.gate == 'outer'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise install stylua@2.4.0
          mise where stylua@2.4.0 >> "$GITHUB_PATH"
          mise install actionlint@1.7.12
          mise where actionlint@1.7.12 >> "$GITHUB_PATH"
          python scripts/bootstrap_runtimes.py 5.4.9
          python scripts/bootstrap.py lint --lua=.cache/toolchains/lua-5.4.9/bin/lua
          python scripts/bootstrap_native.py yaml luals
          python scripts/bootstrap.py consumers --lua="$TEST_LUA" --yaml-dir=.cache/libyaml
      - name: Record tool identities
        run: |
          {
            git rev-parse HEAD
            uname -a
            cc --version
            python --version
            "$TEST_LUA" -v
            luarocks --version
            if [[ "$CI_GATE" != unit ]]; then
              "$TMUX_BIN" -V
              if [[ -n "$CI_CLIENT" ]]; then
                "$CI_CLIENT_BIN" -V
              fi
              ".cache/toolchains/nvim-$CI_NVIM/bin/nvim" --version
            fi
          } 2>&1 | tee .cache/ci/identity.log
      - name: Open a tmate session before the tests
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
      - name: Run offline gates
        run: |
          if [[ "$CI_GATE" == unit ]]; then
            python scripts/check.py unit --lua="$TEST_LUA" 2>&1 | tee .cache/ci/check.log
          else
            python scripts/check.py "$CI_GATE" --lua="$TEST_LUA" --nvim=".cache/toolchains/nvim-$CI_NVIM/bin/nvim" 2>&1 | tee .cache/ci/check.log
          fi
      - name: Run the refusal check with a newer client
        if: matrix.client
        run: |
          TMUX_CLIENT_BIN="$CI_CLIENT_BIN" LIBTMUX_REFUSAL_MAX_MS=500 python scripts/check.py refusal --lua="$TEST_LUA" --nvim=".cache/toolchains/nvim-$CI_NVIM/bin/nvim" 2>&1 | tee .cache/ci/mixed-client.log
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ strategy.job-index }}
          path: |
            .cache/ci/
            .cache/source/*-build.log
            .cache/luals/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate release artifacts
        if: matrix.name == 'Outer current'
        run: |
          source_args=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/release.py verify --event "$GITHUB_EVENT_PATH" --commit "$GITHUB_SHA"
            source_args+=(--public-tag)
          fi
          python scripts/package.py --release --output dist "${source_args[@]}"
      - name: Retain release candidate
        if: matrix.name == 'Outer current'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Open a tmate session after a failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure' }}
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  # One check to require. The plan and the matrix have to have succeeded; a
  # matrix that never ran because the plan failed must not read as a pass.
  required:
    name: required
    needs: [plan, validate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Require every planned job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci_plan.py verify
