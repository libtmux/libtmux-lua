name: Publish

on:
  push:
    tags: ['v*', 'rocks/*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      scope: full

  luarocks:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'libtmux/libtmux-lua'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: luarocks
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/lua-tools
        with:
          groups: dev live
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist/
      - name: Verify release identity and artifact checksums
        run: luajit scripts/release/main.lua verify --event "$GITHUB_EVENT_PATH" --commit "$GITHUB_SHA" --artifacts dist
      - name: Attest release artifacts
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.rockspec
            dist/*.src.rock
      - name: Upload validated artifacts to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: luajit scripts/release/main.lua upload --artifacts dist
      - name: Create GitHub release with artifacts and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: luajit scripts/release/main.lua github-release --tag "$RELEASE_TAG" --artifacts dist --bundle "$PROVENANCE_BUNDLE"
