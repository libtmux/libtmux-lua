name: Publish

on:
  push:
    tags: ['v*', 'rocks/*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  luarocks:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.repository == 'libtmux/libtmux-lua'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: luarocks
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.9
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist/
      - name: Verify release identity and artifact checksums
        run: python scripts/release.py verify --event "$GITHUB_EVENT_PATH" --commit "$GITHUB_SHA" --artifacts dist
      - name: Attest release artifacts
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.rockspec
            dist/*.src.rock
      - name: Upload validated artifacts to LuaRocks
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        run: |
          test -n "$LUAROCKS_API_KEY"
          version="$(jq -r .version release.json)"
          luarocks upload "dist/libtmux-$version.rockspec" "dist/libtmux-$version.src.rock" --temp-key "$LUAROCKS_API_KEY"
      - name: Create GitHub release with artifacts and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" dist/provenance.sigstore.json
          version="$(jq -r .version release.json)"
          release_args=()
          if [[ "$version" =~ (alpha|beta|rc)[0-9]+ ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "libtmux $version" --generate-notes "${release_args[@]}" dist/*.rockspec dist/*.src.rock dist/SHA256SUMS dist/candidate.json dist/provenance.sigstore.json
